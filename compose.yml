# Quiz M9 d'une seule commande : docker compose up --build
#
# Deux services (deux conteneurs) sur un réseau privé où chacun joint l'autre
# par son NOM : le client appelle l'API à http://api:3000.

services:
  # TODO (jalon ③) : le service api.
  #
  #   build:   contexte « . » (la racine), Dockerfile server/Dockerfile
  #   ports:   "3000:3000"  (pour curl et le harnais depuis le poste)
  #   volumes: quizm9-data monté sur /data, là où DB_PATH place la base
  api:
    image: alpine
    command: ["sh", "-c", "echo 'À faire : le service api (jalon ③).' && exit 1"]

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    ports:
      - "5173:5173"
    environment:
      API_URL: http://api:3000
    depends_on:
      - api

volumes:
  # Le fichier SQLite vit ici, PAS dans le conteneur : il survit à
  # docker compose down, et à la destruction du conteneur api.
  quizm9-data:
